name: Homebrew Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.1.2)'
        required: true
        type: string
      auto_merge:
        description: 'Auto-merge the formula PR'
        required: false
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Pre-Release Validation
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Determine version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          GIT_REF: ${{ github.ref }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GIT_REF#refs/tags/}"
            VERSION="${VERSION#v}"
          fi
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version: $VERSION (expected semver like 1.2.3)"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Verify version matches package.json
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Release version: $RELEASE_VERSION"
          echo "Package version: $PKG_VERSION"
          if [ "$PKG_VERSION" != "$RELEASE_VERSION" ]; then
            echo "::error::Version mismatch: package.json=$PKG_VERSION, release=$RELEASE_VERSION"
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --run

      - name: Bundle
        run: npm run build:bundle

      - name: Verify bundle
        run: test -f dist/index.js && echo "Bundle OK ($(wc -c < dist/index.js) bytes)"

      - name: Build MCPB bundle
        run: npm run build:mcpb

      - name: Upload MCPB artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcpb-bundle
          path: himalaya-mcp-v*.mcpb

  upload-mcpb:
    name: Upload MCPB to Release
    needs: [validate]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - name: Download MCPB artifact
        uses: actions/download-artifact@v4
        with:
          name: mcpb-bundle

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          shopt -s nullglob
          MCPB_FILES=(himalaya-mcp-v*.mcpb)
          if [ ${#MCPB_FILES[@]} -eq 0 ]; then
            echo "ERROR: No .mcpb file found — build may have failed"
            exit 1
          fi
          MCPB_FILE="${MCPB_FILES[0]}"
          gh release upload "$TAG_NAME" "$MCPB_FILE" --repo "$GITHUB_REPOSITORY"
          echo "Uploaded $MCPB_FILE to release $TAG_NAME"

  prepare:
    name: Prepare Release Info
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.validate.outputs.version }}
      sha256: ${{ steps.release.outputs.sha256 }}

    steps:
      - name: Calculate tarball SHA
        id: release
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          TARBALL_URL="https://github.com/Data-Wise/himalaya-mcp/archive/refs/tags/v${VERSION}.tar.gz"
          EMPTY_SHA="e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
          TMPFILE=$(mktemp /tmp/tarball-XXXXXX)

          # Retry up to 5 times (tarball may not be ready immediately after release)
          for i in 1 2 3 4 5; do
            HTTP_CODE=$(curl -sL --max-time 30 -w '%{http_code}' -o "$TMPFILE" "$TARBALL_URL")
            if [ "$HTTP_CODE" = "200" ]; then
              SHA256=$(sha256sum "$TMPFILE" | cut -d' ' -f1)
              if [ -n "$SHA256" ] && [ "$SHA256" != "$EMPTY_SHA" ]; then
                echo "sha256=$SHA256" >> $GITHUB_OUTPUT
                echo "Version: $VERSION"
                echo "SHA256: $SHA256"
                rm -f "$TMPFILE"
                exit 0
              fi
              echo "Attempt $i: Empty tarball, retrying in 10s..."
            else
              echo "Attempt $i: HTTP $HTTP_CODE, retrying in 10s..."
            fi
            sleep 10
          done
          rm -f "$TMPFILE"
          echo "::error::Failed to download tarball after 5 attempts"
          exit 1

  verify-tap-auth:
    name: Verify tap-write credentials
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Check auth method availability and validity
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          # Belt-and-suspenders pre-check so we fail fast with an
          # actionable runbook instead of dying inside actions/checkout
          # with "fatal: could not read Username".

          has_app=false
          has_pat=false
          [ -n "$APP_ID" ] && [ -n "$APP_PRIVATE_KEY" ] && has_app=true
          [ -n "$TAP_TOKEN" ] && has_pat=true

          echo "Auth method discovery:"
          echo "  GitHub App credentials: $([ "$has_app" = true ] && echo present || echo MISSING)"
          echo "  PAT (HOMEBREW_TAP_GITHUB_TOKEN): $([ "$has_pat" = true ] && echo present || echo MISSING)"

          if [ "$has_app" = false ] && [ "$has_pat" = false ]; then
            cat <<'EOF'
          ::error::No tap-write credentials configured.

          Fix (pick ONE):

          A) GitHub App (recommended):
             Set these repo secrets on Data-Wise/himalaya-mcp:
               gh secret set APP_ID --body "<app-id>" --repo Data-Wise/himalaya-mcp
               gh secret set APP_PRIVATE_KEY < private-key.pem
             App must be installed on Data-Wise/homebrew-tap with
             Contents read+write and Pull requests read+write.

          B) Personal Access Token (fallback):
             Fine-grained PAT scoped to Data-Wise/homebrew-tap with
             Contents read+write and Pull requests read+write:
               gh secret set HOMEBREW_TAP_GITHUB_TOKEN --body "<pat>"
          EOF
            exit 1
          fi

          # Validate the PAT can authenticate against the tap.
          if [ "$has_pat" = true ]; then
            echo "Validating PAT against Data-Wise/homebrew-tap..."
            status=$(curl -sS -o /tmp/pat-check.json -w "%{http_code}" \
              -H "Authorization: Bearer $TAP_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/Data-Wise/homebrew-tap)
            case "$status" in
              200)
                push_perm=$(grep -o '"push"[[:space:]]*:[[:space:]]*true' /tmp/pat-check.json || true)
                if [ -z "$push_perm" ]; then
                  echo "::warning::PAT can read tap but lacks push permission."
                  if [ "$has_app" = false ]; then
                    echo "::error::No working auth method (App missing, PAT read-only)."
                    exit 1
                  fi
                else
                  echo "PAT is valid and has push permission."
                fi
                ;;
              401|403)
                echo "::warning::PAT failed authentication (HTTP $status) — likely expired or wrong scope."
                if [ "$has_app" = false ]; then
                  cat <<'EOF'
          ::error::PAT is invalid and no GitHub App configured. Rotate the PAT:
            1. https://github.com/settings/personal-access-tokens/new
            2. Repository access: Data-Wise/homebrew-tap
            3. Permissions: Contents read+write, Pull requests read+write
            4. gh secret set HOMEBREW_TAP_GITHUB_TOKEN --body "<new-pat>"
          EOF
                  exit 1
                fi
                echo "PAT is broken but GitHub App will be used as primary."
                ;;
              *)
                echo "::warning::Unexpected response validating PAT: HTTP $status"
                ;;
            esac
            rm -f /tmp/pat-check.json
          fi

          echo "Auth pre-check passed. Primary method: $([ "$has_app" = true ] && echo App || echo PAT)"

  update-homebrew:
    name: Update Homebrew Formula
    needs: [prepare, verify-tap-auth]
    uses: Data-Wise/homebrew-tap/.github/workflows/update-formula.yml@e50f83d6fa9bf3eda3f4d7c289455677c4b1856d
    with:
      formula_name: himalaya-mcp
      version: ${{ needs.prepare.outputs.version }}
      sha256: ${{ needs.prepare.outputs.sha256 }}
      source_type: github
      auto_merge: ${{ inputs.auto_merge || github.event_name == 'release' }}
    secrets:
      app_id: ${{ secrets.APP_ID }}
      app_private_key: ${{ secrets.APP_PRIVATE_KEY }}
      tap_token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
